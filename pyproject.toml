# =============================================================================
# pyproject.toml — Python project metadata & dependencies
# =============================================================================
#
# Databricks Apps detects this file at build time and uses `uv` to resolve
# and install the listed deps into the app container. (If a `requirements.txt`
# is also present, pip is used instead and it takes precedence — we don't
# include one, so uv handles everything.)
# =============================================================================

[build-system]
# hatchling builds the wheel. Required so `agent_server` gets installed as a
# proper Python package inside the container, which is what makes uvicorn's
# `agent_server.start_server:app` import string resolvable at runtime.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-demo"
version = "0.1.0"
description = "Minimal Databricks Apps agent (ResponsesAgent + ChatDatabricks)"
requires-python = ">=3.11"

# Runtime deps. Keep this list as small as possible — every package here
# extends the cold-start time of the app.
dependencies = [
  "fastapi>=0.129.0",        # AgentServer's ASGI app is FastAPI under the hood
  "uvicorn>=0.41.0",         # ASGI server that hosts the FastAPI app
  "mlflow>=3.10.0",          # Provides mlflow.genai.agent_server + tracing
  "databricks-agents>=1.9.3",# Bundles the Responses types + agent helpers
  # [memory] extra pulls in AsyncCheckpointSaver + psycopg + langgraph
  # checkpoint deps for the Lakebase-backed thread persistence path.
  "databricks-langchain[memory]>=0.19.0",
  "langchain>=1.0.0",        # LangChain framework
  "langchain-core>=1.0.0",   # LangChain message types (HumanMessage, etc.)
  "langgraph>=1.0.0",        # Graph + thread-keyed checkpointing
]

[tool.hatch.build.targets.wheel]
# Tell hatchling which directory contains the importable package. Without
# this, the wheel build can't find `agent_server/` and uvicorn can't import
# `agent_server.start_server:app` at runtime.
packages = ["agent_server"]

